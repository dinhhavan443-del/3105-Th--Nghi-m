name: Build iOS App

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build 3105 for iOS
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List project schemes
        run: xcodebuild -list -project ThreeOneOSFive.xcodeproj

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .app
        run: |
          APP_PATH="build/DerivedData/Build/Products/Debug-iphoneos/3105.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/3105-unsigned-app.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ios-app
          path: build/3105-unsigned-app.zip
          if-no-files-found: error
          retention-days: 14
